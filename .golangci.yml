version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - whitespace
    - nlreturn
    - rowserrcheck
    - unparam
    - tparallel
    - nolintlint
    - misspell
    - godot
  exclusions:
    paths:
      - visualization/frontend/node_modules
    rules:
      # go-zero's conf loader uses `optional` as configuration metadata.
      - path: config/config.go
        text: 'SA5008: invalid appearance of unknown `optional` tag option'

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
